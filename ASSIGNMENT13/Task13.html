<!DOCTYPE html>
<html lang="en">
<head>
    <title> Reader's Haven - Book Registeration & Order Form </title>
<body>
    <form>
        <label>Customer Name</label>
        <input type="text" placeholder="name"><br><br>
        <label>Email Adress</label>
        <input type="text" placeholder="@gmail.com"><br><br>
        <label>Mobile Number</label>
        <input type="number" placeholder="86598xxxxx"><br><br>
        <label>Age</label>
        <input type="number" placeholder="eg.123"><br><br>
        <label>Password</label>
        <input type="password" placeholder="'enter your password"><br><br>
        <label>Delivery date</label>
        <input type="date"><br><br>
        <label> Preferred Delivery time</label>
        <input type="time"><br><br>
        <select>
            <option>Fiction</option>
            <option>Science</option>
            <option>History</option>
            <option required>Children's Books</option>
        </select>
        <br><br>
        <label>Book Title</label>
        <input type="text"><br><br>
        <label>Quantity</label><br>
        <input type="number" min="2"><br><br>
        <label>Preferred Payment Method:</label><br><br>
        <label>Cash on Delivery</label><br>
        <input type="radio"><br><br>
        <label>Online payment</label>
        <input type="radio"><br><br>
        <label>Additional Services:</label>
        <label>Gift Wrapping</label>
        <input type="checkbox"><br><br>
        <label>Bookmark Express Delivery</label>
        <input type="checkbox"><br><br>
        <label>Greeting Card</label>
        <input type="checkbox"><br><br>
        <input hidden value="Reader'Haven Book Order"><br>
        <label>file upload</label>
        <input type=""><br>
        <label>Delivery Address</label>
        <textarea rows="6" cols="10" maxlength="100" minlength="10" >
         
        </textarea>
        
    </form>
    
</body>
</html>
